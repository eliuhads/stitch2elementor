<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#00B0FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bg)" rx="16"/>
  <rect width="1200" height="380" fill="url(#grid)" rx="16"/>
  
  <!-- Glowing Orbs -->
  <circle cx="200" cy="100" r="140" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="1000" cy="280" r="160" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Border -->
  <rect width="1198" height="378" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="15" opacity="0.8"/>

  <!-- Badge Top -->
  <g transform="translate(600, 70)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="-110" cy="0" r="5" fill="#00E676"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">v22.0.0 • DETERMINISTIC HYBRID</text>
  </g>

  <!-- Title -->
  <text x="600" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="900" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="-1.5">
    stitch2elementor
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.2">
    The Universal Deterministic Bridge for AI Coding Agents
  </text>

  <!-- Flow Pill -->
  <g transform="translate(600, 280)">
    <!-- Pill Background -->
    <rect x="-380" y="-24" width="760" height="48" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Flow items -->
    <text x="-260" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">Google Stitch AI</text>
    <text x="-140" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#64748b" text-anchor="middle">→</text>
    <text x="-30" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#00E676" text-anchor="middle">Python AST Engine</text>
    <text x="90" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#64748b" text-anchor="middle">→</text>
    <text x="240" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#fb923c" text-anchor="middle">Elementor Flexbox v4</text>
  </g>
</svg>
